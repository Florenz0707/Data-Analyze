name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install backend dependencies
        run: uv sync --project backend/django_backend --frozen

      - name: Install frontend dependencies
        run: npm ci --prefix frontend/vue_frontend

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run repository hooks
        run: pre-commit run --all-files

      - name: Run backend tests and coverage gate
        working-directory: backend/django_backend
        env:
          DJANGO_TESTING: 'true'
        run: |
          uv run coverage run --data-file=/tmp/data-analyze.coverage \
            --source=deepseek_api,deepseek_project \
            --omit='*/migrations/*,*/tests/*,*/asgi.py,*/wsgi.py' \
            manage.py test --noinput
          uv run coverage report --data-file=/tmp/data-analyze.coverage \
            --omit='*/migrations/*,*/tests/*,*/asgi.py,*/wsgi.py' \
            --fail-under=80

      - name: Run frontend static checks and unit tests
        run: |
          npm run lint --prefix frontend/vue_frontend
          npm run format:check --prefix frontend/vue_frontend
          npm run test:coverage --prefix frontend/vue_frontend
          npm run build --prefix frontend/vue_frontend

      - name: Install Playwright browser
        run: npx --prefix frontend/vue_frontend playwright install --with-deps chromium

      - name: Run frontend end-to-end test
        run: npm run test:e2e --prefix frontend/vue_frontend
