target-version = "py313"
line-length = 100
extend-exclude = [
    "backend/django_backend/.venv",
    "backend/django_backend/data",
    "backend/django_backend/deepseek_api/migrations",
]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
